<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="c5-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FA8C0"/>
      <stop offset="55%" stop-color="#D8E4E0"/>
      <stop offset="100%" stop-color="#EFC088"/>
    </linearGradient>
    <linearGradient id="c5-mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6E7C8C"/>
      <stop offset="100%" stop-color="#4A5560"/>
    </linearGradient>
    <linearGradient id="c5-lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FAEC0"/>
      <stop offset="100%" stop-color="#4E7E92"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#c5-sky)"/>
  <ellipse cx="620" cy="80" rx="140" ry="80" fill="#FFE4A0" opacity="0.35"/>

  <!-- Distant mountains -->
  <path d="M0,220 L120,120 L220,220 L320,140 L420,220 L540,110 L650,220 L800,150 L800,270 L0,270 Z" fill="url(#c5-mountain)" opacity="0.6"/>
  <!-- Snow caps -->
  <path d="M100,135 L120,120 L140,138 Z" fill="#F0F4F6" opacity="0.7"/>
  <path d="M520,128 L540,110 L560,130 Z" fill="#F0F4F6" opacity="0.7"/>

  <!-- Lake -->
  <rect x="0" y="270" width="800" height="180" fill="url(#c5-lake)"/>
  <ellipse cx="400" cy="275" rx="380" ry="10" fill="#E8F0EE" opacity="0.2"/>

  <!-- Lakeside village on far shore -->
  <rect x="330" y="235" width="20" height="28" fill="#C86A43" opacity="0.85"/>
  <polygon points="330,235 340,222 350,235" fill="#8B3F22" opacity="0.85"/>
  <rect x="352" y="242" width="16" height="21" fill="#D9A05A" opacity="0.82"/>
  <polygon points="352,242 360,231 368,242" fill="#9A4F2B" opacity="0.82"/>
  <rect x="370" y="230" width="18" height="33" fill="#E0B27A" opacity="0.85"/>
  <polygon points="370,230 379,217 388,230" fill="#8B3F22" opacity="0.85"/>
  <rect x="392" y="238" width="14" height="25" fill="#C86A43" opacity="0.8"/>
  <polygon points="392,238 399,227 406,238" fill="#9A4F2B" opacity="0.8"/>
  <!-- Reflection -->
  <rect x="330" y="264" width="76" height="26" fill="#C86A43" opacity="0.15"/>

  <!-- Cypress on shoreline -->
  <ellipse cx="300" cy="255" rx="5" ry="20" fill="#3E4A2E" opacity="0.7"/>
  <ellipse cx="415" cy="252" rx="5" ry="18" fill="#3E4A2E" opacity="0.7"/>

  <!-- Foreground shore -->
  <path d="M0,400 Q200,380 400,400 Q600,420 800,395 L800,450 L0,450 Z" fill="#B79470" opacity="0.55"/>

  <!-- Caption -->
  <rect x="0" y="390" width="800" height="60" fill="#2D2A26" opacity="0.72"/>
  <text x="400" y="418" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#F9E4C0" letter-spacing="2.5" opacity="0.95">every place tells a story</text>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#D6A94D" letter-spacing="5.5" opacity="0.82">CULO VILLAGE</text>
</svg>
