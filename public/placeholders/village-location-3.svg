<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="c3-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B0C8D4"/>
      <stop offset="55%" stop-color="#EBDFC4"/>
      <stop offset="100%" stop-color="#E8A868"/>
    </linearGradient>
    <linearGradient id="c3-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B9A5E"/>
      <stop offset="100%" stop-color="#6B7C3B"/>
    </linearGradient>
    <linearGradient id="c3-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A876"/>
      <stop offset="100%" stop-color="#8B6840"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#c3-sky)"/>
  <ellipse cx="660" cy="90" rx="130" ry="80" fill="#FFE4A0" opacity="0.35"/>

  <!-- Rolling hill -->
  <path d="M0,255 Q150,220 320,238 Q480,255 650,225 Q730,210 800,222 L800,450 L0,450 Z" fill="url(#c3-hill)" opacity="0.9"/>

  <!-- Vineyard rows -->
  <g stroke="#4A5438" stroke-width="2" opacity="0.4">
    <line x1="60" y1="300" x2="140" y2="450"/>
    <line x1="110" y1="295" x2="200" y2="450"/>
    <line x1="165" y1="292" x2="265" y2="450"/>
    <line x1="225" y1="290" x2="335" y2="450"/>
    <line x1="290" y1="292" x2="405" y2="450"/>
    <line x1="360" y1="296" x2="475" y2="450"/>
  </g>

  <!-- Farmhouse cluster on hilltop -->
  <rect x="330" y="205" width="30" height="34" fill="#C86A43" opacity="0.88"/>
  <polygon points="330,205 345,188 360,205" fill="#8B3F22" opacity="0.88"/>
  <rect x="362" y="215" width="20" height="24" fill="#D9A05A" opacity="0.85"/>
  <polygon points="362,215 372,203 382,215" fill="#A0522D" opacity="0.85"/>
  <rect x="300" y="220" width="18" height="19" fill="#E0B27A" opacity="0.8"/>
  <polygon points="300,220 309,209 318,220" fill="#9A4F2B" opacity="0.8"/>

  <!-- Cypress avenue leading up -->
  <ellipse cx="410" cy="245" rx="5" ry="22" fill="#3E4A2E" opacity="0.75"/>
  <ellipse cx="425" cy="240" rx="5" ry="20" fill="#3E4A2E" opacity="0.75"/>
  <ellipse cx="440" cy="236" rx="5" ry="18" fill="#3E4A2E" opacity="0.75"/>
  <ellipse cx="230" cy="248" rx="5" ry="20" fill="#3E4A2E" opacity="0.75"/>
  <ellipse cx="215" cy="252" rx="5" ry="18" fill="#3E4A2E" opacity="0.75"/>

  <!-- Foreground ground -->
  <rect x="0" y="350" width="800" height="100" fill="url(#c3-ground)"/>

  <!-- Caption -->
  <rect x="0" y="390" width="800" height="60" fill="#2D2A26" opacity="0.72"/>
  <text x="400" y="418" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#F9E4C0" letter-spacing="2.5" opacity="0.95">every place tells a story</text>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#D6A94D" letter-spacing="5.5" opacity="0.82">CULO VILLAGE</text>
</svg>
