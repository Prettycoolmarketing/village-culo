<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="c6-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C0D0"/>
      <stop offset="55%" stop-color="#EAD8B8"/>
      <stop offset="100%" stop-color="#E4A468"/>
    </linearGradient>
    <linearGradient id="c6-peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A8878"/>
      <stop offset="100%" stop-color="#556050"/>
    </linearGradient>
    <linearGradient id="c6-terrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B79470"/>
      <stop offset="100%" stop-color="#8B6840"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#c6-sky)"/>
  <ellipse cx="180" cy="85" rx="150" ry="80" fill="#FFE4A0" opacity="0.3"/>

  <!-- Distant peak -->
  <path d="M300,110 L420,260 L180,260 Z" fill="url(#c6-peak)" opacity="0.55"/>
  <path d="M340,150 L420,260 L260,260 Z" fill="url(#c6-peak)" opacity="0.4"/>

  <!-- Terraced hillside town climbing the slope -->
  <path d="M0,260 Q200,230 400,250 Q600,270 800,240 L800,450 L0,450 Z" fill="url(#c6-terrace)"/>

  <!-- Terrace tiers -->
  <path d="M0,300 Q200,280 400,296 Q600,312 800,286 L800,300 Q600,326 400,310 Q200,294 0,314 Z" fill="#9A7A55" opacity="0.4"/>
  <path d="M0,350 Q200,335 400,348 Q600,360 800,340 L800,355 Q600,375 400,362 Q200,349 0,364 Z" fill="#8B6840" opacity="0.4"/>

  <!-- Stacked hillside houses, dense cluster climbing up -->
  <g opacity="0.88">
    <rect x="250" y="200" width="22" height="30" fill="#C86A43"/>
    <polygon points="250,200 261,187 272,200" fill="#8B3F22"/>
    <rect x="274" y="212" width="18" height="20" fill="#D9A05A"/>
    <polygon points="274,212 283,200 292,212" fill="#9A4F2B"/>
    <rect x="228" y="215" width="20" height="18" fill="#E0B27A"/>
    <polygon points="228,215 238,203 248,215" fill="#8B3F22"/>
    <rect x="300" y="225" width="20" height="24" fill="#C86A43"/>
    <polygon points="300,225 310,212 320,225" fill="#9A4F2B"/>
    <rect x="322" y="235" width="16" height="20" fill="#D9A05A"/>
    <polygon points="322,235 330,224 338,235" fill="#8B3F22"/>
    <rect x="205" y="230" width="18" height="16" fill="#E0B27A"/>
    <polygon points="205,230 214,219 223,230" fill="#9A4F2B"/>
  </g>
  <!-- Watchtower crowning the hill -->
  <rect x="265" y="165" width="16" height="42" fill="#E8D4B0" opacity="0.85"/>
  <polygon points="265,165 273,150 281,165" fill="#C4A882" opacity="0.88"/>

  <!-- Cypress accents -->
  <ellipse cx="360" cy="245" rx="5" ry="20" fill="#3E4A2E" opacity="0.72"/>
  <ellipse cx="190" cy="248" rx="5" ry="18" fill="#3E4A2E" opacity="0.72"/>

  <!-- Foreground ground -->
  <rect x="0" y="380" width="800" height="70" fill="#8B6840" opacity="0.4"/>

  <!-- Caption -->
  <rect x="0" y="390" width="800" height="60" fill="#2D2A26" opacity="0.72"/>
  <text x="400" y="418" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#F9E4C0" letter-spacing="2.5" opacity="0.95">every place tells a story</text>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#D6A94D" letter-spacing="5.5" opacity="0.82">CULO VILLAGE</text>
</svg>
